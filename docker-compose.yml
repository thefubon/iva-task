services:
  # MongoDB как одноузловой replica set (rs0) — обязательно для транзакций Payload.
  mongo:
    image: mongo:8.0.21
    restart: unless-stopped
    command: ['--replSet', 'rs0', '--bind_ip_all']
    ports:
      - '${MONGO_PORT:-27027}:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongo-init:
    image: mongo:8.0.21
    depends_on:
      mongo:
        condition: service_healthy
    restart: 'no'
    entrypoint:
      - bash
      - -c
      - |
        mongosh --host mongo:27017 --quiet --eval '
          try { rs.status().ok }
          catch (e) {
            rs.initiate({ _id: "rs0", members: [{ _id: 0, host: "mongo:27017" }] });
          }'

  # Первый запуск (пустой volume): заливает backup/mongo/iva360.archive.gz.
  # Если в БД уже есть users — не трогает данные.
  mongo-restore:
    image: mongo:8.0.21
    depends_on:
      mongo:
        condition: service_healthy
      mongo-init:
        condition: service_completed_successfully
    restart: 'no'
    volumes:
      - ./backup/mongo:/backup:ro
    entrypoint: ['bash', '/backup/restore.sh']

  # Порты 9002/9003 — чтобы не пересекаться с iva360-next на 9000/9001.
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ':9001'
    ports:
      - '${MINIO_API_PORT:-9002}:9000'
      - '${MINIO_CONSOLE_PORT:-9003}:9001'
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    restart: 'no'
    volumes:
      - ./backup/minio:/seed:ro
    entrypoint: ['/bin/sh', '/seed/restore.sh']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-iva360-media}

volumes:
  mongo_data:
  minio_data:
